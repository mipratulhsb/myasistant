<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Command Center - Mipra</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="dashboardApp()">

    <!-- Header / Sapaan AI Gemini Interaktif -->
    <header class="bg-slate-800 border-b border-slate-700 p-6 shadow-xl">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
            
            <!-- Avatar / Indikator AI -->
            <div class="relative mb-3">
                <div class="w-14 h-14 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <span class="text-2xl">✨</span>
                </div>
                <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-800 rounded-full animate-pulse"></span>
            </div>

            <!-- Kotak Sapaan AI dengan Efek Mengetik -->
            <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl px-6 py-4 max-w-xl shadow-inner w-full mb-4">
                <p class="text-lg font-medium text-indigo-300 min-h-[3.5rem] flex items-center justify-center">
                    <span x-text="typedText"></span><span class="animate-pulse text-indigo-400">|</span>
                </p>
            </div>

            <!-- Input Cepat untuk merespons AI -->
            <form @submit.prevent="submitToAI" class="flex w-full max-w-xl gap-2">
                <input 
                    type="text" 
                    x-model="userQuery" 
                    placeholder="Ketik apa yang ingin Anda lakukan hari ini..." 
                    class="flex-1 bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:outline-none px-4 py-3 rounded-xl text-sm text-slate-200 placeholder-slate-500 shadow-sm"
                >
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20 flex items-center gap-2"
                >
                    <span>Kirim</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>

        </div>
    </header>

    <!-- Main Content / Panel Manajemen (Tetap di bawahnya) -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Panel Hafalan Quran -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-indigo-500 transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-indigo-300 flex items-center gap-2">📖 Hafalan Quran</h2>
                <span class="text-xs bg-indigo-900 text-indigo-200 px-2 py-1 rounded-lg">Target Harian</span>
            </div>
            <p class="text-slate-400 text-sm mb-4">Belum ada target aktif yang dimuat dari database.</p>
            <button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-sm font-medium transition">Kelola Hafalan</button>
        </div>

        <!-- Panel Keuangan -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-emerald-500 transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-emerald-300 flex items-center gap-2">💰 Keuangan</h2>
                <span class="text-xs bg-emerald-900 text-emerald-200 px-2 py-1 rounded-lg">Bulan Ini</span>
            </div>
            <div class="mb-4">
                <span class="text-2xl font-bold text-slate-100">Rp 0</span>
                <p class="text-xs text-slate-400 mt-1">Total Saldo / Pengeluaran</p>
            </div>
            <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-medium transition">Catat Transaksi</button>
        </div>

        <!-- Panel Manajemen Waktu -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-amber-500 transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-amber-300 flex items-center gap-2">⏱️ Manajemen Waktu</h2>
                <span class="text-xs bg-amber-900 text-amber-200 px-2 py-1 rounded-lg">To-Do</span>
            </div>
            <p class="text-slate-400 text-sm mb-4">Tidak ada tugas mendesak hari ini.</p>
            <button class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-xl text-sm font-medium transition">Tambah Tugas</button>
        </div>
    </main>

    <!-- Script Logika Alpine.js & Typing Effect -->
    <script>
        function dashboardApp() {
            return {
                userQuery: '',
                fullText: '',
                typedText: '',
                
                init() {
                    // Tentukan waktu sapaan
                    const hour = new Date().getHours();
                    let timeGreeting = 'Selamat Pagi';
                    if (hour >= 11 && hour < 15) timeGreeting = 'Selamat Siang';
                    else if (hour >= 15 && hour < 18) timeGreeting = 'Selamat Sore';
                    else if (hour >= 18 || hour < 4) timeGreeting = 'Selamat Malam';

                    // Susun kalimat sapaan sesuai permintaan
                    this.fullText = `${timeGreeting} Mip, kita mau ngapain hari ini?`;
                    this.startTypingEffect();
                },

                startTypingEffect() {
                    let i = 0;
                    this.typedText = '';
                    let speed = 50; // Kecepatan mengetik (ms)
                    
                    let typingInterval = setInterval(() => {
                        if (i < this.fullText.length) {
                            this.typedText += this.fullText.charAt(i);
                            i++;
                        } else {
                            clearInterval(typingInterval);
                        }
                    }, speed);
                },

                submitToAI() {
                    if (!this.userQuery.trim()) return;
                    alert(`Pesan terkirim ke Gemini: "${this.userQuery}". (Integrasi API Gemini siap dipasang!)`);
                    this.userQuery = '';
                }
            }
        }
    </script>
</body>
</html>
