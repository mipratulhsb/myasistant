<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Command Center - Mipra</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="dashboardApp()">

    <!-- Top Navigation Bar dengan Menu Profil -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center relative shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/30">M</div>
            <span class="font-semibold text-slate-200 tracking-wide">Command Center</span>
        </div>

        <!-- Tombol & Dropdown Profil -->
        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-700/80 border border-slate-700 px-3 py-2 rounded-xl transition text-sm font-medium text-slate-200 cursor-pointer">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                <span x-text="profile.panggilan || 'Mipra'"></span>
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Dropdown Menu Profil & Pengaturan Wawasan -->
            <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 mt-2 w-80 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-4 z-50 text-slate-200">
                <h3 class="font-semibold text-indigo-400 mb-3 text-sm flex items-center gap-2">⚙️ Pengaturan & Wawasan AI</h3>
                
                <!-- Form Nama -->
                <div class="mb-3">
                    <label class="block text-xs text-slate-400 mb-1">Nama Lengkap & Panggilan</label>
                    <input type="text" x-model="profile.namaLengkap" placeholder="Nama Lengkap" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs mb-1 text-slate-200 focus:outline-none focus:border-indigo-500">
                    <input type="text" x-model="profile.panggilan" placeholder="Nama Panggilan" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Kolom Wawasan / Instruksi Dasar Tambahan -->
                <div class="mb-3">
                    <label class="block text-xs text-slate-400 mb-1">Wawasan & Instruksi Dasar AI (Berkembang)</label>
                    <textarea x-model="profile.customInstructions" rows="4" placeholder="Tambahkan informasi baru, aturan, atau konteks masa depan di sini..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    <p class="text-[10px] text-slate-500 mt-0.5">AI akan otomatis membaca wawasan ini untuk merespons Anda.</p>
                </div>

                <button @click="saveProfile(); open = false;" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-xs font-medium transition shadow-lg shadow-indigo-600/20 cursor-pointer">
                    Simpan Perubahan
                </button>
            </div>
        </div>
    </nav>

    <!-- Header / Sapaan & Interaksi AI Gemini -->
    <header class="bg-slate-800/50 border-b border-slate-800 p-6 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
            
            <!-- Avatar / Indikator AI -->
            <div class="relative mb-3">
                <div class="w-14 h-14 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <span class="text-2xl">✨</span>
                </div>
                <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-800 rounded-full animate-pulse"></span>
            </div>

            <!-- Kotak Sapaan & Respons AI dengan Efek Mengetik -->
            <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl px-6 py-4 max-w-xl shadow-inner w-full mb-4 min-h-[5rem] flex items-center justify-center">
                <p class="text-lg font-medium text-indigo-300">
                    <span x-text="typedText"></span><span class="animate-pulse text-indigo-400" x-show="isTyping">|</span>
                </p>
            </div>

            <!-- Input Cepat untuk merespons AI -->
            <form @submit.prevent="submitToAI" class="flex w-full max-w-xl gap-2">
                <input 
                    type="text" 
                    x-model="userQuery" 
                    :disabled="loadingAI"
                    placeholder="Tanya sesuatu atau beri perintah ke Gemini..." 
                    class="flex-1 bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:outline-none px-4 py-3 rounded-xl text-sm text-slate-200 placeholder-slate-500 shadow-sm disabled:opacity-50"
                >
                <button 
                    type="submit" 
                    :disabled="loadingAI"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20 flex items-center gap-2 disabled:opacity-50 cursor-pointer"
                >
                    <span x-text="loadingAI ? '...' : 'Kirim'"></span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>

        </div>
    </header>

    <!-- Main Content / Panel Manajemen -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- Panel 1: Hafalan Quran -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-indigo-500 transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-indigo-300 flex items-center gap-2">📖 Hafalan Quran</h2>
                <span class="text-xs bg-indigo-900 text-indigo-200 px-2 py-1 rounded-lg">Target Harian</span>
            </div>
            <p class="text-slate-300 text-sm mb-4" x-text="hafalanStatus">Memuat data hafalan...</p>
            <button @click="alert('Fitur tambah hafalan akan segera aktif!')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-sm font-medium transition cursor-pointer">Kelola Hafalan</button>
        </div>

        <!-- Panel 2: Manajemen Keuangan -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-emerald-500 transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-emerald-300 flex items-center gap-2">💰 Keuangan</h2>
                <span class="text-xs bg-emerald-900 text-emerald-200 px-2 py-1 rounded-lg">Bulan Ini</span>
            </div>
            <div class="mb-4">
                <span class="text-2xl font-bold text-slate-100" x-text="totalKeuangan">Rp 0</span>
                <p class="text-xs text-slate-400 mt-1">Total Saldo / Transaksi</p>
            </div>
            <button @click="alert('Fitur keuangan segera hadir!')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-medium transition cursor-pointer">Catat Transaksi</button>
        </div>

        <!-- Panel 3: Manajemen Waktu / To-Do -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-md hover:border-amber-500 transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-amber-300 flex items-center gap-2">⏱️ Manajemen Waktu</h2>
                <span class="text-xs bg-amber-900 text-amber-200 px-2 py-1 rounded-lg">To-Do</span>
            </div>
            <p class="text-slate-300 text-sm mb-4" x-text="todoStatus">Memuat daftar tugas...</p>
            <button @click="alert('Fitur to-do list segera hadir!')" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-xl text-sm font-medium transition cursor-pointer">Tambah Tugas</button>
        </div>

    </main>

    <!-- Script Utama: Supabase & Gemini REST API dengan Fallback Otomatis -->
    <script>
        const SUPABASE_URL = 'https://bcgxbzksdawtxkxjyzia.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y1snRnFpheepSQLngSCntg_9fHuA7AN';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cachedApiKey = '';

        document.addEventListener('alpine:init', () => {
            Alpine.data('dashboardApp', () => ({
                userQuery: '',
                typedText: 'Memuat sapaan...',
                isTyping: true,
                loadingAI: false,
                hafalanStatus: 'Memuat data hafalan...',
                totalKeuangan: 'Rp 0',
                todoStatus: 'Memuat daftar tugas...',
                
                profile: {
                    namaLengkap: 'Mipratul Muslim',
                    panggilan: 'Mipra',
                    customInstructions: 'Anggota Polri berpangkat Bripda (Ba Mintu Yanma Polda Sumbar), mahasiswa S1 Hukum Universitas Terbuka (NIM: 055943782), pembina asrama & media admin Bimbel Pradipta Padang.'
                },
                
                async init() {
                    const hour = new Date().getHours();
                    let timeGreeting = 'Selamat Pagi';
                    if (hour >= 11 && hour < 15) timeGreeting = 'Selamat Siang';
                    else if (hour >= 15 && hour < 18) timeGreeting = 'Selamat Sore';
                    else if (hour >= 18 || hour < 4) timeGreeting = 'Selamat Malam';

                    const greetingText = `${timeGreeting} ${this.profile.panggilan}, kita mau ngapain hari ini?`;
                    this.startTypingEffect(greetingText);
                    
                    await this.loadConfigAndData();
                },

                startTypingEffect(text) {
                    let i = 0;
                    this.typedText = '';
                    this.isTyping = true;
                    let speed = 35;
                    
                    let typingInterval = setInterval(() => {
                        if (i < text.length) {
                            this.typedText += text.charAt(i);
                            i++;
                        } else {
                            clearInterval(typingInterval);
                            this.isTyping = false;
                        }
                    }, speed);
                },

                async loadConfigAndData() {
                    try {
                        const { data: configData } = await _supabase.from('user_config').select('key_value').eq('key_name', 'gemini_api_key').single();
                        if (configData && configData.key_value) {
                            cachedApiKey = configData.key_value;
                        }

                        const { data: profileData } = await _supabase.from('user_config').select('key_value').eq('key_name', 'user_profile_wawasan').single();
                        if (profileData && profileData.key_value) {
                            try {
                                const parsed = JSON.parse(profileData.key_value);
                                this.profile = parsed;
                            } catch (e) {
                                console.error("Gagal parsing profil:", e);
                            }
                        }

                        const { data: hafalan } = await _supabase.from('hafalan_quran').select('*').limit(1);
                        if (hafalan && hafalan.length > 0) {
                            this.hafalanStatus = `Target: Surah ${hafalan[0].surah} Ayat ${hafalan[0].ayat}`;
                        } else {
                            this.hafalanStatus = 'Belum ada target hafalan.';
                        }

                        const { data: todos } = await _supabase.from('todos').select('*').eq('selesai', false).limit(1);
                        if (todos && todos.length > 0) {
                            this.todoStatus = `Tugas aktif: ${todos[0].tugas}`;
                        } else {
                            this.todoStatus = 'Tidak ada tugas aktif.';
                        }
                    } catch (err) {
                        console.error('Gagal memuat data dari Supabase:', err);
                    }
                },

                async saveProfile() {
                    try {
                        const payload = JSON.stringify(this.profile);
                        const { error } = await _supabase.from('user_config').upsert({
                            key_name: 'user_profile_wawasan',
                            key_value: payload
                        }, { onConflict: 'key_name' });

                        if (error) throw error;
                        alert('Profil & wawasan sistem berhasil diperbarui dan disimpan ke Supabase!');
                    } catch (err) {
                        console.error("Gagal menyimpan profil:", err);
                        alert('Gagal menyimpan ke database.');
                    }
                },

                async callGeminiAPI(modelName, payload) {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${cachedApiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    return response;
                },

                async submitToAI() {
                    if (!this.userQuery.trim() || this.loadingAI) return;
                    
                    if (!cachedApiKey) {
                        this.startTypingEffect("API Key belum ditemukan di database Supabase.");
                        return;
                    }

                    const prompt = this.userQuery;
                    this.userQuery = '';
                    this.loadingAI = true;
                    this.typedText = '';

                    const payload = {
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    {
                                        text: `Profil Tuanmu: Nama ${this.profile.namaLengkap} (${this.profile.panggilan}). Wawasan/Instruksi: ${this.profile.customInstructions}\n\nPertanyaan: ${prompt}`
                                    }
                                ]
                            }
                        ]
                    };
                    
                    let replyText = null;

                    try {
                        // 1. Coba gunakan Model Utama: gemini-3.7-flash
                        let response = await this.callGeminiAPI('gemini-3.7-flash', payload);
                        
                        // Jika model utama gagal / terkena kuota (status code 429 atau 5xx), lakukan fallback
                        if (!response.ok) {
                            console.warn("Model utama sibuk/kuota habis, beralih ke model fallback: gemini-3.5-flash-lite");
                            response = await this.callGeminiAPI('gemini-3.5-flash-lite', payload);
                        }

                        if (response.ok) {
                            const data = await response.json();
                            if (data && data.candidates && data.candidates.length > 0 && 
                                data.candidates[0].content && data.candidates[0].content.parts && 
                                data.candidates[0].content.parts.length > 0) {
                                replyText = data.candidates[0].content.parts[0].text;
                            }
                        }

                        if (replyText) {
                            this.startTypingEffect(replyText);
                        } else {
                            this.startTypingEffect("Maaf, format respons tidak dikenali server.");
                        }
                    } catch (error) {
                        console.error("Error koneksi Gemini API:", error);
                        this.startTypingEffect("Terjadi kesalahan koneksi ke server Gemini.");
                    } finally {
                        this.loadingAI = false;
                    }
                }
            }));
        });
    </script>
</body>
</html>
